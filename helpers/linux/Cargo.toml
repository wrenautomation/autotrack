[package]
name = "autotrack-helper"
version = "0.2.0"
edition = "2021"
license = "PolyForm-Strict-1.0.0"
publish = false
description = "autotrack's Linux helper: probe (AT-SPI, X11), shots (MIT-SHM, JPEG), OCR (tesseract)"

[[bin]]
name = "autotrack-helper"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = "1"
x11rb = { version = "0.14", default-features = false, features = ["shm", "randr", "xfixes"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std", "simd"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
