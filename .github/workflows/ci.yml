name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -s lint
      - run: pnpm -s typecheck
      - run: pnpm -s test
      - name: extension
        working-directory: extension
        run: |
          pnpm install --frozen-lockfile
          pnpm -s typecheck
          pnpm -s test

  e2e:
    name: e2e ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The helper tests run from this job's shell, so grant its likely "responsible" processes
      # too (GitHub's macOS images run with SIP off). mac.sh grants the installed app separately.
      - name: TCC grants for the helper tests (mac)
        if: runner.os == 'macOS'
        run: >
          sh test/e2e/mac-tcc.sh "$(command -v node)" "$PWD/helpers/mac/probe"
          /usr/local/opt/runner/provisioner/provisioner /bin/bash /bin/sh /bin/zsh || true
      - name: helper tests (mac)
        if: runner.os == 'macOS'
        run: sh helpers/mac/test.sh
      - name: helper tests (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File helpers\win\test.ps1

      - name: bundle
        run: node scripts/bundle.mjs

      - name: install, drive input, ship, check, uninstall (mac)
        if: runner.os == 'macOS'
        run: sh test/e2e/mac.sh
      - name: install, drive input, ship, check, uninstall (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test\e2e\win.ps1

      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: ${{ runner.temp }}/autotrack-e2e
          if-no-files-found: ignore
          retention-days: 7

  # The double-click installers, built from the just-built bundle and run silently on each OS:
  # install, doctor, upgrade over it, uninstall. Also parse-checks the PowerShell scripts.
  installers:
    name: installer ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: version
        id: v
        shell: bash
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: PowerShell parses (windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in 'install\install.ps1', 'installer\windows\run.ps1', 'installer\windows\build.ps1', 'installer\windows\smoke.ps1') {
            $tokens = $null; $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$tokens, [ref]$errs)
            foreach ($e in $errs) { Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: shell scripts parse (mac)
        if: runner.os == 'macOS'
        run: for f in install/install.sh installer/mac/build.sh installer/mac/smoke.sh installer/mac/autotrack-installer; do sh -n "$f"; done
      - run: node scripts/bundle.mjs
      - name: build the installer (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\build.ps1
      - name: install, doctor, upgrade, uninstall (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\smoke.ps1 -Installer installer\windows\out\autotrack-setup-${{ steps.v.outputs.version }}.exe -Version ${{ steps.v.outputs.version }}
      - name: build the installer (mac)
        if: runner.os == 'macOS'
        run: sh installer/mac/build.sh
      - name: install, doctor, upgrade, uninstall (mac)
        if: runner.os == 'macOS'
        run: sh installer/mac/smoke.sh "installer/mac/out/autotrack-${{ steps.v.outputs.version }}.dmg" "${{ steps.v.outputs.version }}"
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/autotrack-installer-smoke
            installer/windows/out/*.exe
            installer/mac/out/*.dmg
          if-no-files-found: ignore
          retention-days: 3
