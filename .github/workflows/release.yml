name: release

# Push a tag like v0.1.0 (matching package.json) to build the three bundles on their own runners and
# publish them with SHA256SUMS as a GitHub Release. The installers fetch releases/latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    name: bundle ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, target: win32-x64, file: autotrack-win32-x64.zip }
          - { os: macos-latest, target: darwin-arm64, file: autotrack-darwin-arm64.tar.gz }
          - { os: macos-15-intel, target: darwin-x64, file: autotrack-darwin-x64.tar.gz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: tag matches package.json
        shell: bash
        run: |
          v=$(node -p 'require("./package.json").version')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/bundle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            bundles/${{ matrix.file }}
            bundles/autotrack-extension.zip
          if-no-files-found: error

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: out
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: out
        run: |
          ls -la
          sha256sum autotrack-* > SHA256SUMS
          cat SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" out/*
          --repo "$GITHUB_REPOSITORY" --title "autotrack $GITHUB_REF_NAME" --generate-notes

  # What a person runs, against the release just published: the one-line install from main, then
  # doctor and uninstall. A shape-valid code with a fake key; nothing ships, nothing starts at login.
  smoke:
    needs: publish
    name: install from the release, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AUTOTRACK_NO_AUTOSTART: "1"
      AUTOTRACK_NO_BROWSER: "1"
    steps:
      - name: install code
        shell: bash
        run: |
          code=$(node -e 'console.log(Buffer.from(JSON.stringify({v:1,bucket:"autotrack-smoke",region:"us-east-1",device:"smoke",keyId:"AKIASMOKETESTKEY0001",secret:"smoke-secret-not-a-real-key"})).toString("base64url"))')
          echo "AUTOTRACK=$code" >> "$GITHUB_ENV"
      - name: install, doctor, uninstall (mac)
        if: runner.os == 'macOS'
        run: |
          sh -c "$(curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/install/install.sh)"
          cli="$HOME/Library/Application Support/autotrack/app/bin/autotrack"
          "$cli" doctor || true
          test -f "$HOME/Library/Application Support/autotrack/app/VERSION"
          grep -q "^${GITHUB_REF_NAME#v}+" "$HOME/Library/Application Support/autotrack/app/VERSION"
          "$cli" uninstall --yes
          test ! -e "$HOME/Library/Application Support/autotrack/app"
      - name: install, doctor, uninstall (windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install/install.ps1" | iex
          $app = Join-Path $env:LOCALAPPDATA 'autotrack\app'
          & "$app\autotrack.cmd" doctor
          $v = (Get-Content "$app\VERSION" -Raw).Trim()
          if (-not $v.StartsWith($env:GITHUB_REF_NAME.TrimStart('v') + '+')) { throw "installed $v, expected $env:GITHUB_REF_NAME" }
          & "$app\autotrack.cmd" uninstall --yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall exited $LASTEXITCODE" }
          # node.exe can't delete its own folder: a detached cmd removes it ~3 s after exit
          for ($i = 0; $i -lt 30 -and (Test-Path $app); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $app) { throw "uninstall left $app" }
