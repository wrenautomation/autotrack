name: release

# Push a tag like v0.1.0 (matching package.json) to build the three bundles and the two installers
# (Windows setup .exe, Mac disk image) on their own runners and publish them with SHA256SUMS as a
# GitHub Release. The one-line installers fetch releases/latest. A tag with a dash (v0.1.1-rc.1) is
# published as a prerelease: GitHub never makes it "latest", so the one-line installs ignore it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    name: bundle ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, target: win32-x64, file: autotrack-win32-x64.zip }
          - { os: macos-latest, target: darwin-arm64, file: autotrack-darwin-arm64.tar.gz }
          - { os: macos-15-intel, target: darwin-x64, file: autotrack-darwin-x64.tar.gz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: tag matches package.json
        shell: bash
        run: |
          v=$(node -p 'require("./package.json").version')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/bundle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            bundles/${{ matrix.file }}
            bundles/autotrack-extension.zip
          if-no-files-found: error

  # The Windows setup program (Inno Setup): carries the win32 bundle, runs install.ps1 against it.
  installer-windows:
    needs: bundle
    name: installer windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle-win32-x64
          path: bundles
      - name: build
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: installer/windows/out/autotrack-setup-*.exe
          if-no-files-found: error

  # The Mac disk image: "autotrack Installer.app" carrying both Mac bundles and install.sh.
  installer-mac:
    needs: bundle
    name: installer mac
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-darwin-*
          path: bundles
          merge-multiple: true
      - name: build
        run: sh installer/mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer-mac
          path: installer/mac/out/autotrack-*.dmg
          if-no-files-found: error

  publish:
    needs: [bundle, installer-windows, installer-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: out
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: out
        run: |
          ls -la
          sha256sum autotrack-* > SHA256SUMS
          cat SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* $flags \
            --repo "$GITHUB_REPOSITORY" --title "autotrack $GITHUB_REF_NAME" --generate-notes

  # What a person runs, against the release just published: the one-line install from main, then
  # doctor and uninstall. A shape-valid code with a fake key; nothing ships, nothing starts at login.
  smoke:
    needs: publish
    name: install from the release, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AUTOTRACK_NO_AUTOSTART: "1"
      AUTOTRACK_NO_BROWSER: "1"
    steps:
      # releases/latest skips prereleases: point the one-line install at this release's own bundle.
      - name: prerelease bundle
        if: contains(github.ref_name, '-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS" in macOS) asset=autotrack-darwin-arm64.tar.gz ;; *) asset=autotrack-win32-x64.zip ;; esac
          mkdir -p "$RUNNER_TEMP/rel"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --pattern SHA256SUMS --dir "$RUNNER_TEMP/rel"
          echo "AUTOTRACK_BUNDLE=$RUNNER_TEMP/rel/$asset" >> "$GITHUB_ENV"
      - name: install code
        shell: bash
        run: |
          code=$(node -e 'console.log(Buffer.from(JSON.stringify({v:1,bucket:"autotrack-smoke",region:"us-east-1",device:"smoke",keyId:"AKIASMOKETESTKEY0001",secret:"smoke-secret-not-a-real-key"})).toString("base64url"))')
          echo "AUTOTRACK=$code" >> "$GITHUB_ENV"
      - name: install, doctor, uninstall (mac)
        if: runner.os == 'macOS'
        run: |
          sh -c "$(curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/install/install.sh)"
          cli="$HOME/Library/Application Support/autotrack/app/bin/autotrack"
          "$cli" doctor || true
          test -f "$HOME/Library/Application Support/autotrack/app/VERSION"
          grep -q "^${GITHUB_REF_NAME#v}+" "$HOME/Library/Application Support/autotrack/app/VERSION"
          "$cli" uninstall --yes
          test ! -e "$HOME/Library/Application Support/autotrack/app"
      - name: install, doctor, uninstall (windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/install/install.ps1" | iex
          $app = Join-Path $env:LOCALAPPDATA 'autotrack\app'
          & "$app\autotrack.cmd" doctor
          $v = (Get-Content "$app\VERSION" -Raw).Trim()
          if (-not $v.StartsWith($env:GITHUB_REF_NAME.TrimStart('v') + '+')) { throw "installed $v, expected $env:GITHUB_REF_NAME" }
          & "$app\autotrack.cmd" uninstall --yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall exited $LASTEXITCODE" }
          # node.exe can't delete its own folder: a detached cmd removes it ~3 s after exit
          for ($i = 0; $i -lt 30 -and (Test-Path $app); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $app) { throw "uninstall left $app" }

  # The installers, as downloaded from the release just published: the Mac disk image is mounted and
  # run with no UI; the Windows setup program runs silently, then Add/Remove Programs uninstalls it.
  smoke-installer:
    needs: publish
    name: installer from the release, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: download, verify, install, doctor, uninstall (mac)
        if: runner.os == 'macOS'
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir dl
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "autotrack-$v.dmg" --pattern SHA256SUMS --dir dl
          (cd dl && grep " autotrack-$v.dmg\$" SHA256SUMS | shasum -a 256 -c -)
          sh installer/mac/smoke.sh "dl/autotrack-$v.dmg" "$v"
      - name: download, verify, install, doctor, uninstall (windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory dl | Out-Null
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern "autotrack-setup-$v.exe" --pattern SHA256SUMS --dir dl
          if ($LASTEXITCODE -ne 0) { throw "gh release download exited $LASTEXITCODE" }
          $exe = "dl\autotrack-setup-$v.exe"
          $line = Get-Content dl\SHA256SUMS | Where-Object { $_ -match ("  autotrack-setup-" + [regex]::Escape($v) + "\.exe$") }
          if (-not $line) { throw 'SHA256SUMS has no line for the installer' }
          $want = ($line -split '\s+')[0]
          $got = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          if ($got -ne $want) { throw "checksum mismatch: got $got, want $want" }
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\windows\smoke.ps1 -Installer $exe -Version $v
          if ($LASTEXITCODE -ne 0) { throw "installer smoke exited $LASTEXITCODE" }
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-installer-${{ matrix.os }}
          path: ${{ runner.temp }}/autotrack-installer-smoke
          if-no-files-found: ignore
          retention-days: 7
